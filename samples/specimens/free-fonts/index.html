<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Atkinson Next'; src: url('fonts/free/AtkinsonNext.ttf') format('truetype'); font-weight: 200 800; }
@font-face { font-family: 'Inter'; src: url('fonts/free/InterVariable.ttf') format('truetype'); font-weight: 100 900; }
html, body { margin: 0; background: #fff; }
#receipt { box-sizing: border-box; width: 384px; padding: 4px 8px 12px; color: #000; }
.family { margin: 10px -8px 4px; padding: 3px 8px; background: #000; color: #fff; font: 700 16px/20px Verdana; }
.row { white-space: nowrap; overflow: hidden; }
.tag { display: inline-block; width: 58px; font: 400 11px/14px Verdana; }
.white { margin: 4px -8px 0; padding: 4px 8px; background: #000; color: #fff; }
</style>
</head>
<body>
<main id="receipt"></main>
<script>
const FAMILIES = [["Atkinson Hyperlegible Next", "'Atkinson Next'"], ["Inter", "'Inter'"], ["Verdana (reference)", "Verdana"]];
const receipt = document.getElementById("receipt");
for (const [name, stack] of FAMILIES) {
  const h = document.createElement("div"); h.className = "family"; h.textContent = name; receipt.append(h);
  const weights = stack === "Verdana" ? [400, 700] : [400, 500, 600, 700];
  for (const size of [16, 20]) for (const w of weights) {
    const row = document.createElement("div"); row.className = "row";
    row.style.font = `${w} ${size}px/${Math.round(size * 1.3)}px ${stack}`;
    row.innerHTML = `<span class="tag">${size}px ${w}</span>Quick fox 0123 legible`;
    receipt.append(row);
  }
  const white = document.createElement("div"); white.className = "white";
  white.style.font = `500 16px/22px ${stack}`; white.textContent = "White on black at 500: readable?";
  receipt.append(white);
}
</script>
</body>
</html>
