<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; background: #fff; }
#receipt { box-sizing: border-box; width: 384px; padding: 4px 10px 12px; color: #000; }
.tag { margin-top: 10px; padding-top: 4px; border-top: 2px solid #000; font: 700 12px/16px Verdana; }
.white { margin: 3px -10px 0; padding: 3px 10px; background: #000; color: #fff; }
</style>
</head>
<body>
<main id="receipt"></main>
<script>
const COMBOS = [
  ["Verdana", 16, 700], ["Verdana", 19, 400],
  ["Tahoma", 16, 700], ["Tahoma", 19, 400],
  ["Avenir Next Condensed", 16, 600], ["Avenir Next Condensed", 19, 500],
  ["Avenir Next Condensed", 19, 600], ["Avenir Next Condensed", 22, 500],
];
const receipt = document.getElementById("receipt");
for (const [family, size, weight] of COMBOS) {
  const font = `${weight} ${size}px/${Math.round(size * 1.3)}px '${family}'`;
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = `${family} ${size}px ${weight}`;
  const body = document.createElement("div");
  body.style.font = font;
  body.textContent = "Call the dentist before Friday 10:30. Buy milk, eggs and coffee beans.";
  const white = document.createElement("div");
  white.className = "white";
  white.style.font = font;
  white.textContent = "White on black: TODAY 3 tasks";
  receipt.append(tag, body, white);
}
</script>
</body>
</html>
