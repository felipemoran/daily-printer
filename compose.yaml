# The print server in Docker: docs/setup-deploy.md, "Docker Compose".
name: daily-printer

services:
  server:
    build: .
    image: daily-printer:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRINT_SERVER_PORT:-8787}:8787"
    volumes:
      - "${PRINT_SERVER_CONFIG:?set PRINT_SERVER_CONFIG to the server config file, in the environment or in .env}:/config/server.toml:ro"
      - data:/data
    healthcheck:
      # The container's own hostname, not 127.0.0.1: a config that listens on loopback only fails this check.
      test: ["CMD", "python", "-c", "import socket, urllib.request; urllib.request.urlopen(f'http://{socket.gethostname()}:8787/admin', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 1s

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN
    depends_on:
      server:
        condition: service_healthy

  printer-home:
    image: daily-printer:local
    profiles: [test]
    command: ["uv", "run", "--script", "src/scripts/print_device.py", "--server", "ws://server:8787/device",
              "--token-file", "/test/home.token", "--fake", "/printers/home"]
    environment: &offline
      UV_OFFLINE: "1"
    volumes: &device-volumes
      - ./deploy/compose-test:/test:ro
      - printers:/printers
    depends_on: &after-server
      server:
        condition: service_healthy

  printer-work:
    image: daily-printer:local
    profiles: [test]
    command: ["uv", "run", "--script", "src/scripts/print_device.py", "--server", "ws://server:8787/device",
              "--token-file", "/test/work.token", "--fake", "/printers/work"]
    environment: *offline
    volumes: *device-volumes
    depends_on: *after-server

  check:
    image: daily-printer:local
    profiles: [check]
    command: [".venv/bin/python", "src/scripts/compose_check.py", "--server", "http://server:8787",
              "--config", "/config/server.toml", "--printers", "/printers"]
    volumes:
      - "${PRINT_SERVER_CONFIG:?set PRINT_SERVER_CONFIG to the server config file}:/config/server.toml:ro"
      - data:/data:ro
      - printers:/printers:ro

volumes:
  data:
  printers:
