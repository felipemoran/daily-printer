<!doctype html>
<html>
<head><meta charset="utf-8"><title>Step — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Thermal, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(T.Paper, { feed: false },
      h(T.Step, { n: 1, timer: '10 min' }, 'Toast the rice in butter until the edges turn translucent.'),
      h(T.Step, { n: 2 }, 'Add the wine; stir until it is absorbed.'),
      h(T.Step, { n: 3, timer: '18 min' }, 'Add stock a ladle at a time, stirring, until creamy.'))
  );
</script>
</body>
</html>
