<!doctype html>
<html>
<head><meta charset="utf-8"><title>TestType — test strip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>.t-l { font-size: 16px; line-height: 24px; font-weight: 700; } .t-row { display: flex; align-items: center; gap: 12px; min-height: 24px; }</style>
</head>
<body>
<div id="root" style="padding:24px 32px"></div>
<script>
  var T = window.Thermal, h = React.createElement;
  var sizes = [14, 15, 16, 18, 20, 21, 22], weights = [400, 500, 600, 700];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(T.Paper, { print: true },
      h(T.HeaderBar, { left: 'TEST · TYPE', right: '1/1' }),
      h(T.SectionLabel, { style: { marginTop: 24 } }, 'PLEX MONO · SIZE / WEIGHT'),
      sizes.map(function (s) { return h('div', { key: s, style: { marginBottom: 12 } }, weights.map(function (w) { return h('div', { key: w, style: { fontSize: s, fontWeight: w, lineHeight: Math.round(s * 1.34) + 'px', whiteSpace: 'nowrap', overflow: 'hidden' } }, s + '/' + w + ' OPS-2481 resolved ilmn'); })); }),
      h(T.SectionLabel, null, 'REVERSED'),
      [16, 18, 20].map(function (s) { return [500, 700].map(function (w) { return h('div', { key: s + '-' + w, style: { background: '#000', color: '#fff', fontSize: s, fontWeight: w, lineHeight: Math.round(s * 1.34) + 'px', padding: '4px 12px', marginBottom: 6 } }, s + '/' + w + ' TICKET UPDATE 14:08'); }); }),
      h(T.SectionLabel, null, 'ARCHIVO 62% · 700 / 900'),
      [42, 48, 63, 79, 92].map(function (s) { return [700, 900].map(function (w) { return h('div', { key: s + '-' + w, className: 'rp-d', style: { fontSize: s, fontWeight: w, lineHeight: Math.round(s * 0.95) + 'px' } }, s + '/' + w + ' OPS'); }); })
    )
  );
</script>
</body>
</html>
