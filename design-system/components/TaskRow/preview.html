<html>
<head><meta charset="utf-8"><title>TaskRow — preview</title>

<body>
<div id="root"></div>
<script>
  var T = window.Thermal, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(T.Paper, { feed: false },
      h(T.Rule, { weight: 'bar', style: { margin: '0 0 4px' } }),
      h(T.TaskRow, { title: 'Review Q4 roadmap draft', meta: 'planning · due 12:00', tag: 'P1' }),
      h(T.TaskRow, { title: 'Book flights for offsite', meta: 'personal' }),
      h(T.TaskRow, { title: 'Send invoice #2026-114', meta: 'finance', done: true }))
  );
</script>
