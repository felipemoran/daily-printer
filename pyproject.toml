[project]
name = "daily-printer"
version = "0.1.0"
description = "Personal thermal printer automation — daily tickets, emails, tasks"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "bleak>=3.0.1",
    "pillow>=12.2.0",
    "playwright>=1.58.0",
    "pyjwt[crypto]>=2.15.1",
    "pyserial>=3.5",
    "python-dotenv>=1.2.2",
    "python-escpos[usb]>=3.1",
    "todoist-api-python>=4.0.0",
]
